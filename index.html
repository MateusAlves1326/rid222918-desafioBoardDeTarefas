<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <script src="./index.js"></script>
    <link rel="icon" href="checkedIcon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <title>Board de Tarefas</title>
</head>

<body>
    <main>
        <h1>Board de tarefas</h1>

        <!-- Formulário -->
        <form id="task-form">
            <input type="text" id="taskName" placeholder="Nome da tarefa" required />
            <input type="text" id="taskTag" placeholder="Etiqueta" required />
            <button type="submit" class="add">+</button>
        </form>


        <!-- Lista -->
        <div id="taskList" class="task-list"></div>

        <footer id="footerCounter">0 tarefas concluídas</footer>
    </main>


</body>

</html>
